<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack</title>
    <link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jacquard+12&family=Jersey+10&family=Tiny5&display=swap" rel="stylesheet">


</head>
<body id="home">
    <header id="headerhome">
        <button id="btnlogout"onclick="logout()">
            Logout
        </button>
    <button id="btnprofile" onclick="showstats()">
    Perfil
    </button>
    </header>
    <div id="title">
            <h1>Blackjack</h1>

    </div>
    <section id="buttons">
 <div id="lr">
     <button onclick="handleSignup()">
        Registro
    </button>
    <button onclick="handleLogin()">
        Login
    </button>
    </div>
<div id="btnjugar">
        <button id="iniciar" onclick="handleir()">Jugar</button>

</div>
    <div id="tr">
         <button onclick="window.location.href='tienda.html';">
        Tienda
    </button>
  <button onclick="window.location.href='ranking.html';">
        Ranking
    </button>
    </div>

    </section>
   
   <p id="homeaviso"></p>

    
    
    <dialog id="dialogpoints">
  <h2 id="ppoints">Seleccione cuántos puntos quiere apostar</h2>
  <div id="pi">
     <p>Tus puntos: <span  id="showuserpoints"></span></p>
  <input type="number" id="inputpoints">
  </div>
 
  <button id="confirmpoints" class="btndialog" >Enviar</button>
    </dialog>


<dialog id="dialoguser">
  <h2>Usuario: <span id="h2user"></span></h2>
  <div id="stats">
     <p>Puntos: <span  id="statpoints"></span></p>
     <p>Partidas ganadas: <span  id="statwins"></span></p>
     <p>Partidas perdidas: <span  id="statlosses"></span></p>
     <p>Partidas jugadas: <span  id="statplayed"></span></p>
     <p>Puntos perdidos: <span  id="statlostpoints"></span></p>
     <p>Racha: <span  id="statstreak"></span></p>
     <p>Cantidad de items: <span  id="statitems"></span></p>

  </div>
 
  <button id="statreturn" class="btndialog" onclick="window.location.reload()">Volver</button>
    </dialog>



    <script src="fetch.js"></script>
    <script src="usuarios.js"></script>
    <script src="blackjack.js"></script>
    <script src="items.js"></script>
    <script src="logic.js"></script>
    <script src="juego.js"></script>
    
</body>
</html>
