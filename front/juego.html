<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack</title>
    <link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jacquard+12&family=Jersey+10&family=Tiny5&display=swap" rel="stylesheet">

  </head>
  <header id="juegoheader">
    
    <button onclick="window.location.href='index.html';">Volver</button>
  </header>
<body id="juego">
  <section id="game">
<div id="pss">
      <p id="infdealer" class="infp"><span class="decoration"></span>Dealer: <span id="sumadealer"></span><span class="decoration"></span></p>
<p id="infuser" class="infp"><span class="decoration"></span>Vos: <span id="sumauser"></span><span class="decoration"></span></p>
  </div>

  <div id="cardsec">
    <div id="cartasdealer" class="cartas"></div>
    <div id="cartasuser" class="cartas"></div>
  </div>


  </section>
  
    
    <section id="hitstand">
      
      <button id="buttonhit" onclick="hit()">Hit</button>
      <button id="buttonstand" onclick="stand()">Stand</button>
    </section>
    



    <dialog id="win">
  <h2>Ganaste!</h2>
  <p><span class="decoration"></span>Dealer: <span id="sumadealer1"></span></p>
  <p><span class="decoration"></span>Vos: <span id="sumauser1"></span></p>
  <p><span class="decoration"></span>Tu dinero: <span id="points1"></span></p>
  <div class="dialgbtns">
    <button id="reload" onclick="replay()">Volver a jugar</button>
    <button id="home" onclick="window.location.href='index.html';">Home</button>

  </div>
    </dialog>



<dialog id="lose">
  <h2>Perdiste</h2>
  <p><span class="decoration"></span>Dealer: <span id="sumadealer2"></span></p>
  <p><span class="decoration"></span>Vos: <span id="sumauser2"></span></p>
  <p><span class="decoration"></span>Tu dinero: <span id="points2"></span></p>
  <p id="avisonopoints"></p>
    <div class="dialgbtns">
      <button id="reload" onclick="replay()">Volver a jugar</button>
      <button id="home" onclick="window.location.href='index.html';">Home</button>
</div>
    </dialog>
    <script src="fetch.js"></script>
    <script src="usuarios.js"></script>
    <script src="blackjack.js"></script>
    <script src="items.js"></script>
    <script src="logic.js"></script>
    <script src="juego.js"></script>
    <script src="tienda.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", itemCheck());
      </script>
    <script>
    document.addEventListener("DOMContentLoaded", iraljuego());
  </script>
    
</body>
</html>
